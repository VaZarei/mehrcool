[tool.black]
line-length = 100
target-version = ["py312", "py313", "py314"]
extend-exclude = '''
/(
    \.venv
  | migrations
  | node_modules
  | media
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "**/migrations/*", "media", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "N", "D"]
ignore = [
    "D100",  # module docstrings enforced manually in app code, not in every __init__
    "D104",
    "D105",
    "D106",
    "D203",
    "D212",
    "D213",
    "D401",
    "D107",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
# Seed modules are prose/data: long copy strings are intentional.
"apps/core/seed/*" = ["E501"]
# QA scripts configure Django before importing models.
"scripts/*" = ["E402", "D", "E501"]
# SVG path data and markup templates cannot be wrapped meaningfully.
"apps/core/icons.py" = ["E501"]
"apps/core/placeholders.py" = ["E501"]
"**/migrations/*" = ["D", "E501"]
"manage.py" = ["D"]
"config/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]
