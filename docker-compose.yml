services:
  mcr_show:
    build:
      context: /opt/vps-data/mcr/git-clone-1
      dockerfile: Dockerfile
    container_name: mcr_show_container
    restart: unless-stopped
    env_file:
      - /opt/vps-data/mcr/git-clone-1/.env.production
    volumes:
      - /opt/vps-data/mcr/bank/container:/app/bank/container
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: mcr_network