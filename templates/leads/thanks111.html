{% extends "base.html" %}
{% block content %}
<section class="section {% if minimal_chrome %}section--darker section--fill{% endif %}">
  <div class="container container--narrow text-center stack stack--lg">
    <h1>{{ heading }}</h1>
    <p class="lead mx-auto {% if minimal_chrome %}text-on-dark-muted{% endif %}">{{ body }}</p>
    <div class="cluster cluster--center">
      {% call_button label=site.emergency_phone size="lg" %}
      <a class="btn {% if minimal_chrome %}btn--outline-light{% else %}btn--outline{% endif %} btn--lg" href="/">Back to the homepage</a>
    </div>
  </div>
</section>
{% endblock %}
