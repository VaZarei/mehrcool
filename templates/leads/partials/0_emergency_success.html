<div class="notice notice--dark" role="status">
  <h2 class="notice__title" data-focus>{% icon "check" %}We're calling {{ lead.phone }} now</h2>
  <p>Keep your phone to hand and the equipment doors shut. If you would rather not wait, the line is open: <a href="{{ site.emergency_tel_href }}" data-event="phone_click">{{ site.emergency_phone }}</a>.</p>
</div>
