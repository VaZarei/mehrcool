<div class="relative bg-white rounded-2xl p-6 md:p-10 lg:p-12 shadow-sm mb-8" style="border: {{ border_width|default:'1px' }} solid {{ border_color|default:'#448ff1' }};">
  <div class="max-w-3xl">
    
    <!-- Headline -->
    <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
      {{ title|default:"Explore Our Services" }}
    </h1>

    <!-- Intro / Lead Text -->
    {% if lead %}
      <p class="mt-5 text-lg md:text-xl text-slate-600 leading-relaxed max-w-2xl">
        {{ lead }}
      </p>
    {% endif %}

  </div>
</div>
