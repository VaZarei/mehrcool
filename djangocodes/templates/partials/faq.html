<div class="faq">
  {% for faq in faqs %}
    <details class="faq__item" {% if forloop.first and open_first %}open{% endif %}>
      <summary class="faq__question">{{ faq.question }}{% icon "chevron-down" size=20 %}</summary>
      <div class="faq__answer">{{ faq.answer|richtext }}</div>
    </details>
  {% endfor %}
</div>
